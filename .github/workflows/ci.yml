name: Android APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Generate Android project
        run: flutter create . --platforms=android --project-name huvalts --org mn.huvaalts
      - run: flutter pub get
      - name: Generate models
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --dart-define-from-file=env/development.json
      - name: Build development APK
        run: flutter build apk --debug --target lib/main.dart --dart-define-from-file=env/development.json
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: huvaalts-android-development-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
